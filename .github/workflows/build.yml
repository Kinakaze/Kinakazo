name: Build package on demand
run-name: Build ${{ inputs.package }} from WinGet with Kinakaze signing

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to build
        type: choice
        required: true
        default: QQNT.Isolated
        options:
          - QQNT.Isolated
      target_user_sid:
        description: Target Windows user SID (run whoami /user on that PC)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Import fixed Kinakaze signing certificate
        timeout-minutes: 3
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          TARGET_USER_SID: ${{ inputs.target_user_sid }}
        run: |
          if ($env:TARGET_USER_SID -notmatch '^S-1-(5-21|12-1)-\d+-\d+-\d+-\d+$') { throw 'Invalid target user SID.' }
          if (-not $env:SIGNING_CERTIFICATE_BASE64 -or -not $env:SIGNING_CERTIFICATE_PASSWORD) { throw 'Configure signing certificate secrets first.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'Kinakaze.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            # Import only this leaf and its key; PFX chain import can open a root-trust dialog.
            $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::UserKeySet -bor [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:SIGNING_CERTIFICATE_PASSWORD, $flags)
            $store = [Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
            try {
              $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $store.Add($certificate)
            } finally { $store.Close() }
            Write-Host 'Imported the signing key.'
            $publicCertificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Join-Path $env:GITHUB_WORKSPACE 'certificates/Kinakaze.cer'))
            if ($certificate.Subject -ne 'CN=Kinakaze' -or $certificate.Thumbprint -ne $publicCertificate.Thumbprint) { throw 'Private key does not match the fixed Kinakaze.cer.' }
            # Force noninteractive trust on this disposable runner; no certificate UI is available.
            certutil.exe -f -addstore TrustedPeople certificates/Kinakaze.cer
            if ($LASTEXITCODE -ne 0) { throw 'Failed to trust the package certificate.' }
            certutil.exe -f -addstore Root certificates/Kinakaze.cer
            if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare Authenticode verification trust.' }
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx }
          }
      - name: Download with aria2, compile with MSVC and sign MSIX
        id: build
        env:
          SELECTED_PACKAGE: ${{ inputs.package }}
          TARGET_USER_SID: ${{ inputs.target_user_sid }}
          BUILD_REVISION: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Build-Package.ps1 -Package $env:SELECTED_PACKAGE -TargetUserSid $env:TARGET_USER_SID -Revision ([int]$env:BUILD_REVISION)
      - name: Upload signed MSIX and public certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.package }}-${{ steps.build.outputs.version }}-signed
          path: |
            artifacts/${{ inputs.package }}/*.msix
            artifacts/${{ inputs.package }}/Kinakaze.cer
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
